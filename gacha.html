<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Gacha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background-color: #4c1d95;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            margin: 0;
        }

        .header { margin-top: 20px; text-align: center; }

        .gacha-machine {
            position: relative;
            width: 300px;
            height: 450px;
            margin-top: 20px;
        }

        .globe {
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.2);
            border: 4px solid #ddd6fe;
            border-radius: 50%;
            position: absolute;
            top: 0;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.3);
        }

        .base {
            position: absolute;
            bottom: 0;
            width: 260px;
            height: 180px;
            background: #f43f5e;
            left: 20px;
            border-radius: 20px 20px 10px 10px;
            border: 4px solid #be123c;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .knob {
            width: 60px;
            height: 60px;
            background: #fbbf24;
            border-radius: 50%;
            margin-top: 30px;
            border: 4px solid #b45309;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .knob:active { transform: rotate(90deg); }

        .slot {
            width: 80px;
            height: 50px;
            background: #000;
            border-radius: 10px;
            margin-top: 20px;
            position: relative;
        }

        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 2px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        .prize-ball {
            position: absolute;
            top: 5px;
            left: 20px;
            opacity: 0;
        }

        .prize-anim {
            animation: dropOut 0.5s forwards;
        }
        @keyframes dropOut {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .ui-panel {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-radius: 20px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .fraction-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 2rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .fraction-input input {
            width: 80px;
            font-size: 2rem;
            text-align: center;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 10px;
            font-family: inherit;
        }

        .fraction-line {
            width: 100%;
            height: 4px;
            background: white;
            margin: 5px 0;
        }
        
        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #059669;
        }
        .btn-submit:active { transform: translateY(6px); box-shadow: 0 0 0 #059669; }

        .flash-red {
            animation: flashR 0.5s ease-out forwards;
        }
        @keyframes flashR {
            0% { box-shadow: inset 0 0 100px #ef4444; }
            100% { box-shadow: inset 0 0 0 transparent; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn" style="position: absolute; top: 20px; left: 20px;">🏠 Menu</a>

    <div class="header">
        <h1 style="margin: 0; color: #fbbf24;">MONSTER GACHA</h1>
        <p id="prompt" style="font-size: 1.5rem;">What is the probability of getting a RED monster?</p>
        <div style="font-size: 1.2rem; color: #fde047;">Score: <span id="score">0</span></div>
    </div>

    <div class="gacha-machine">
        <div class="base">
            <div class="knob" id="knob"></div>
            <div class="slot">
                <div class="ball prize-ball" id="prize-ball"></div>
            </div>
        </div>
        <div class="globe" id="globe">
            <!-- Balls injected by JS -->
        </div>
    </div>

    <div class="ui-panel">
        <div class="fraction-input">
            <input type="number" id="num-in" placeholder="?">
            <div class="fraction-line"></div>
            <input type="number" id="den-in" placeholder="?">
        </div>
        <button class="btn-submit" id="btn-submit">PULL GACHA!</button>
    </div>

    <script src="gacha.js"></script>
</body>
</html>
