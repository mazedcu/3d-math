<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potion Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        html, body {
            height: auto !important;
            overflow: auto !important;
            overflow-x: hidden !important;
        }
        
        body {
            background-color: #2e1065;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% 50%, #4c1d95 0%, #1e1b4b 100%);
        }

        /* Sparkles Background */
        .sparkles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: transparent url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><path d="M10 5 L12 10 L17 12 L12 14 L10 19 L8 14 L3 12 L8 10 Z" fill="rgba(253, 224, 71, 0.4)"/><path d="M110 85 L111 90 L116 91 L111 92 L110 97 L109 92 L104 91 L109 90 Z" fill="rgba(253, 224, 71, 0.2)"/></svg>') repeat;
        }

        /* Dark HUD styling */
        .hud-left {
            background: rgba(30, 27, 75, 0.9) !important;
            border-color: #4c1d95 !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
        }

        .wizard-panel {
            margin-top: 10px;
            display: flex;
            align-items: center;
            background: rgba(46, 16, 101, 0.8);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #a855f7;
            z-index: 10;
            backdrop-filter: blur(5px);
            gap: 15px;
            max-width: 600px;
        }

        .avatar-circle {
            width: 60px;
            height: 60px;
            background: #1e1b4b;
            border-radius: 50%;
            border: 2px solid #a855f7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .dialogue-box {
            display: flex;
            flex-direction: column;
        }

        .dialogue-name {
            font-size: 0.8rem;
            font-weight: 800;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            font-family: 'Outfit', sans-serif;
        }

        .dialogue-text {
            font-size: 1rem;
            font-weight: 500;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            line-height: 1.3;
        }

        .dialogue-text span {
            color: #fde047;
            font-weight: 800;
            text-shadow: 0 0 5px rgba(253, 224, 71, 0.5);
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-top: 5px;
            position: relative;
            z-index: 5;
        }

        .svg-container {
            width: 200px;
            height: 240px;
            position: relative;
        }

        /* SVG Animations */
        .wizard-group {
            transform-origin: center bottom;
            transition: transform 0.3s;
        }
        
        .happy .wizard-group {
            animation: jump 0.4s infinite alternate;
        }
        
        @keyframes jump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .angry .wizard-group {
            animation: shake 0.2s 4;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }
        
        .potion {
            transition: transform 0.5s ease-in-out, opacity 0.5s;
        }
        
        .happy .potion {
            transform: translate(60px, -20px) rotate(15deg) scale(0);
            opacity: 0;
        }
        
        .coins {
            opacity: 0;
        }
        
        .happy .coins {
            animation: coinShower 1s forwards;
        }
        
        @keyframes coinShower {
            0% { opacity: 0; transform: translateY(-100px); }
            20% { opacity: 1; transform: translateY(-50px); }
            100% { opacity: 0; transform: translateY(150px); }
        }

        /* Two-Step Input Area */
        .input-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(46, 16, 101, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid #6b21a8;
            margin-top: 5px;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #d8b4fe;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group input {
            width: 80px;
            height: 40px;
            font-size: 1.5rem;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            border: 2px solid #a855f7;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background: #1e1b4b;
            color: #fde047;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .input-group input:focus {
            border-color: #fde047;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.4);
        }
        
        .input-group input.error {
            border-color: #ef4444;
            color: #ef4444;
            animation: errorShake 0.3s;
        }
        
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 20px;
            z-index: 20;
        }

        .btn-launch {
            background: #f59e0b;
            color: #451a03;
            padding: 12px 40px;
            font-size: 1.4rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b45309, 0 10px 15px rgba(0,0,0,0.3);
            transition: all 0.1s;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-launch:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b45309, 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .btn-launch:disabled {
            background: #475569;
            box-shadow: 0 6px 0 #334155;
            cursor: not-allowed;
            color: #94a3b8;
            transform: none !important;
        }

        .error-msg {
            position: absolute;
            top: 180px;
            color: #fca5a5;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(30, 27, 75, 0.95);
            padding: 12px 25px;
            border-radius: 10px;
            border: 2px solid #ef4444;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 30;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="sparkles"></div>
    <a href="index.html" class="btn" id="nav-btn" style="text-decoration:none; z-index: 200; position: absolute; top: 20px; left: 20px;">🏠 Menu</a>

    <!-- Top HUD -->
    <div id="hud" class="hud" style="justify-content: flex-end; top: 5px;">
        <div class="hud-left">
            <div class="stat accent" style="border: none; background: transparent; padding: 0;">
                <div class="stat-val" id="score-p1" style="color: #c084fc;">0</div>
                <div class="stat-lbl" style="color: #c084fc;">Player 1</div>
            </div>
            
            <div class="stat" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div style="font-size: 1rem; font-weight: 800; color: #c084fc; letter-spacing: 1px;" id="turn-indicator">P1'S TURN</div>
                <div style="font-size: 0.7rem; font-weight: 600; color: #94a3b8; margin-top: 2px;">Customer <span id="try-count">1</span> / 5</div>
            </div>

            <div class="stat accent" style="border: none; background: transparent; padding: 0;">
                <div class="stat-val" id="score-p2" style="color: #f43f5e;">0</div>
                <div class="stat-lbl" style="color: #f43f5e;">Player 2</div>
            </div>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div class="overlay visible" id="announcement-overlay">
        <div class="count-box" style="background: #2e1065; color: white; border-color: #a855f7;">
            <div class="count-emoji" id="announce-emoji">👨‍🌾</div>
            <div class="count-title" id="announce-title" style="font-size: 2rem; color: #c084fc;">PLAYER 1</div>
            <div class="count-result" id="announce-subtitle" style="margin-bottom: 20px; color: #d8b4fe; font-size: 1.1rem;">
                Visit the market! Buy from 5 merchants.
            </div>
            <button class="btn primary" id="btn-start" style="width: 100%; background: #c084fc; color: #2e1065; border: none; box-shadow: 0 6px 0 #9333ea;">START</button>
        </div>
    </div>

    <div class="wizard-panel">
        <div class="avatar-circle">👨‍🌾</div>
        <div class="dialogue-box">
            <div class="dialogue-name">FRUIT SELLER</div>
            <div class="dialogue-text" id="wizard-dialogue">"Ah, you need <span>7</span> apples? My current rate is <span>24</span> gold for <span>4</span> apples!"</div>
        </div>
    </div>
    
    <div id="error-msg" class="error-msg">Incorrect.</div>

    <div class="game-area">
        <div class="svg-container" id="svg-scene">
            <svg viewBox="0 0 200 240" width="100%" height="100%">
                <!-- Background Counter -->
                <rect x="10" y="200" width="180" height="40" fill="#451a03" rx="5" />
                <rect x="5" y="190" width="190" height="10" fill="#78350f" rx="3" />
                
                <!-- Farmer Group -->
                <g class="wizard-group" id="wizard">
                    <!-- Shirt -->
                    <path d="M 60 200 L 80 120 L 120 120 L 140 200 Z" fill="#ef4444" />
                    <!-- Overalls -->
                    <path d="M 75 200 L 85 150 L 115 150 L 125 200 Z" fill="#3b82f6" />
                    <!-- Body/Face -->
                    <circle cx="100" cy="100" r="20" fill="#fcd34d" />
                    <!-- Straw Hat -->
                    <ellipse cx="100" cy="90" rx="35" ry="8" fill="#fef08a" />
                    <path d="M 80 90 Q 100 60 120 90 Z" fill="#fde047" />
                    <!-- Eyes -->
                    <circle cx="93" cy="95" r="3" fill="#1e1b4b" />
                    <circle cx="107" cy="95" r="3" fill="#1e1b4b" />
                </g>
                
                <!-- Apples on counter -->
                <g class="potion" id="potions">
                    <!-- Apple 1 -->
                    <circle cx="35" cy="180" r="8" fill="#ef4444" />
                    <path d="M 35 172 Q 40 165 42 168" stroke="#166534" stroke-width="2" fill="none" />
                    <!-- Apple 2 -->
                    <circle cx="50" cy="180" r="8" fill="#ef4444" />
                    <path d="M 50 172 Q 55 165 57 168" stroke="#166534" stroke-width="2" fill="none" />
                    <!-- Apple 3 -->
                    <circle cx="65" cy="180" r="8" fill="#ef4444" />
                    <path d="M 65 172 Q 70 165 72 168" stroke="#166534" stroke-width="2" fill="none" />
                </g>
                
                <!-- Gold Coins (Hidden) -->
                <g class="coins">
                    <circle cx="100" cy="80" r="8" fill="#fde047" />
                    <circle cx="80" cy="60" r="8" fill="#fde047" />
                    <circle cx="120" cy="70" r="8" fill="#fde047" />
                    <circle cx="110" cy="90" r="8" fill="#fde047" />
                    <circle cx="90" cy="100" r="8" fill="#fde047" />
                </g>
            </svg>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <div class="input-label">🍎 Unit Price (Cost of 1):</div>
                <div class="input-group"><input type="number" id="input-unitary" min="1" placeholder="?"></div>
            </div>
            <div class="input-row">
                <div class="input-label">💰 Total Gold to Pay:</div>
                <div class="input-group"><input type="number" id="input-total" min="1" placeholder="?"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-launch" id="btn-sell">PAY GOLD</button>
    </div>

    <script src="unitary.js"></script>
</body>
</html>
