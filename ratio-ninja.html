<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratio Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .header {
            margin-top: 80px;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .prompt {
            font-size: 1.5rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* The main ratio display */
        .ratio-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8rem;
            font-weight: 700;
            color: #f8fafc;
            z-index: 5;
        }

        .ratio-num {
            position: relative;
            display: inline-block;
            transition: color 0.3s;
        }

        .ratio-colon {
            color: #64748b;
        }

        /* Slashed effect for numbers */
        .slashed {
            animation: sliceDrop 0.5s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
            color: #ef4444;
        }

        @keyframes sliceDrop {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(20px, 40px) rotate(15deg); opacity: 0; }
        }

        /* SVG layer for the sword animation */
        .animation-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            pointer-events: none;
            z-index: 20;
            overflow: visible;
        }

        /* The flying number */
        .flying-number {
            position: absolute;
            top: 50%;
            left: 50%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 700;
            color: #fde047;
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.8);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Sword attached to the number */
        .sword-svg {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            opacity: 1;
            transform: rotate(-15deg);
        }

        /* Slash line */
        .slash-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 6px;
            background: #fde047;
            box-shadow: 0 0 15px #fde047, 0 0 30px #fde047;
            transform: translate(-50%, -50%) rotate(-15deg);
            border-radius: 3px;
            opacity: 0;
        }

        /* The number buttons */
        .button-bank {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
            z-index: 10;
        }

        .btn-number {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 15px 0;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #334155;
            width: 80px;
        }

        .btn-number:hover {
            background: #334155;
            border-color: #64748b;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #475569;
        }

        .btn-number:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #475569;
        }

        /* Shake animation for errors */
        .shake {
            animation: shakeEq 0.3s cubic-bezier(.36,.07,.19,.97) both;
            color: #ef4444;
        }

        @keyframes shakeEq {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .controls-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .action-buttons {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .btn-submit {
            background: #22c55e;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #15803d;
            font-family: 'Outfit', sans-serif;
            margin-top: 0;
            width: 250px;
        }
        .btn-submit:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #15803d;
        }

        .btn-next {
            background: #3b82f6;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2563eb;
            font-family: 'Outfit', sans-serif;
            margin-top: 0;
            display: none;
            width: 250px;
        }
        .btn-next:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2563eb;
        }

        .message-toast {
            position: fixed;
            top: 100px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #ef4444;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

    </style>
</head>
<body>

    <a href="index.html" class="btn" id="nav-btn" style="text-decoration:none; z-index: 50; position: absolute; top: 20px; left: 20px;">🏠 Menu</a>

    <!-- Top HUD -->
    <div id="hud" class="hud" style="justify-content: flex-end; top: 5px;">
        <div class="hud-left" style="background: rgba(15, 23, 42, 0.9); padding: 5px 20px; border-radius: 20px; border: 2px solid #334155; gap: 20px;">
            <div class="stat accent" style="border: none; background: transparent; padding: 0;">
                <div class="stat-val" id="score-p1" style="color: #38bdf8;">0</div>
                <div class="stat-lbl" style="color: #38bdf8;">Score</div>
            </div>
            
            <div class="stat" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div style="font-size: 1rem; font-weight: 800; color: #38bdf8; letter-spacing: 1px;">RATIO NINJA</div>
                <div style="font-size: 0.7rem; font-weight: 600; color: #94a3b8; margin-top: 2px;">Round <span id="try-count">1</span> / 5</div>
            </div>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div class="overlay visible" id="announcement-overlay">
        <div class="count-box" style="background: #0f172a; border-color: #38bdf8;">
            <div class="count-emoji" id="announce-emoji">⚔️</div>
            <div class="count-title" id="announce-title" style="font-size: 2rem; color: #38bdf8;">RATIO NINJA</div>
            <div class="count-result" id="announce-subtitle" style="margin-bottom: 20px; color: rgba(255,255,255,0.7); font-size: 1.1rem;">
                Use your sword divisors to find the simplest ratio! When you think it's completely simplified, hit SUBMIT!
            </div>
            <button class="btn primary" id="btn-start" style="width: 100%; background: #38bdf8; border: none; color: #0f172a; box-shadow: 0 6px 0 #0284c7;">START GAME</button>
        </div>
    </div>

    <div id="msg-toast" class="message-toast">Invalid Cut!</div>

    <div class="header">
        <div class="prompt">SIMPLIFY THE RATIO</div>
        
        <div class="ratio-container" id="ratio-container">
            <span class="ratio-num" id="num-a">24</span>
            <span class="ratio-colon">:</span>
            <span class="ratio-num" id="num-b">36</span>

            <div class="animation-layer" id="anim-layer">
                <div class="slash-line" id="slash-line"></div>
                <div class="flying-number" id="flying-number">
                    <!-- Sword SVG -->
                    <svg class="sword-svg" id="sword-svg" viewBox="0 0 100 100">
                        <!-- Blade -->
                        <path d="M90 10 L20 80" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
                        <path d="M85 5 L95 15 L90 20 L80 10 Z" fill="#94a3b8"/>
                        <!-- Handle -->
                        <path d="M25 85 L15 75 L30 60 L40 70 Z" fill="#b45309"/> 
                        <!-- Pommel -->
                        <circle cx="20" cy="80" r="5" fill="#fde047"/> 
                        <!-- Guard -->
                        <path d="M35 65 L25 55" stroke="#fde047" stroke-width="6" stroke-linecap="round"/> 
                    </svg>
                    <span id="flying-digit" style="position: relative; z-index: 2;">6</span>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="button-bank" id="button-bank">
            <!-- Buttons 2 to 10 generated by JS -->
        </div>

        <div class="action-buttons">
            <button class="btn-submit" id="btn-submit">SUBMIT FINAL RATIO</button>
            <button class="btn-next" id="btn-next">NEXT ROUND</button>
        </div>
    </div>

    <script src="ratio-ninja.js"></script>
</body>
</html>
