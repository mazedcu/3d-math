<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Abacus — Solve with Beads</title>
    <meta name="description" content="Use the interactive virtual abacus to solve maths challenges and earn points!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1e0a3c 0%, #2d1b69 50%, #11235a 100%);
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(2px 2px at 10% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* --- HUD --- */
        #hud {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            gap: 10px;
            flex-shrink: 0;
        }

        .hud-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 16px;
            text-align: center;
            min-width: 100px;
        }

        .hud-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .hud-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.1;
        }

        #score-val { color: #fbbf24; }
        #streak-val { color: #34d399; }

        .back-btn {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            border-radius: 50%;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        /* --- Main Content --- */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        /* Instructions & Steps */
        .task-panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 24px 32px;
            text-align: center;
            min-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .task-step {
            font-size: 1.1rem;
            color: #9ca3af;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .task-text {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .task-hint {
            font-size: 1rem;
            color: #fbbf24;
            font-weight: 500;
        }

        /* --- Abacus Frame --- */
        .abacus-wrapper {
            background: linear-gradient(180deg, #3b1f0a 0%, #5c2d0e 50%, #3b1f0a 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                inset 0 4px 12px rgba(0,0,0,0.5),
                0 15px 40px rgba(0,0,0,0.4),
                0 0 0 4px #7c3f10,
                0 0 0 6px #5c2d0e;
            display: inline-block;
        }

        .abacus-inner {
            display: flex;
            gap: 2px;
            position: relative;
        }

        /* Divider line running horizontally through all columns */
        .divider-beam {
            position: absolute;
            left: 0; right: 0;
            top: 100px; /* Below heaven section */
            height: 16px;
            background: linear-gradient(180deg, #7c3f10, #a0521a, #7c3f10);
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 5;
            pointer-events: none;
        }

        .col-container {
            display: flex;
            flex-direction: column;
            width: 80px;
            position: relative;
        }

        .col-label {
            color: #fcd34d;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .col-value {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .abacus-col {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* The vertical rod */
        .abacus-col::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            background: linear-gradient(90deg, #888 0%, #ccc 50%, #888 100%);
            border-radius: 4px;
            box-shadow: inset 1px 0 2px rgba(255,255,255,0.4), inset -1px 0 2px rgba(0,0,0,0.4);
            z-index: 1;
        }

        .heaven-section {
            height: 100px; /* Space for 1 bead (40px) + gap (60px) */
            position: relative;
            z-index: 2;
        }

        .earth-section {
            height: 220px; /* Space for 4 beads (160px) + gap (60px) */
            position: relative;
            margin-top: 16px; /* Space for divider beam */
            z-index: 2;
        }

        .bead {
            width: 64px;
            height: 38px;
            border-radius: 19px; /* Semi-rounded rectangle like traditional beads */
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: top 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: radial-gradient(ellipse at 35% 35%, #fde68a, #f59e0b 60%, #b45309);
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.5),
                inset 0 -4px 6px rgba(0,0,0,0.4),
                inset 0 4px 6px rgba(255,255,255,0.4);
            border: 1px solid #78350f;
        }

        .bead:hover {
            filter: brightness(1.1);
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }

        .btn-action {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        
        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover {
            background: rgba(255,255,255,0.2);
        }

        /* --- Notification Modal --- */
        #notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #34d399;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(52,211,153,0.3);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        #notification.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #notif-msg {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin: 0;
        }

    </style>
</head>
<body>
    <div class="stars"></div>

    <div id="app">
        <!-- HUD -->
        <div id="hud">
            <a href="index.html" class="back-btn" title="Back to Menu">🏠</a>
            <div class="hud-card">
                <div class="hud-label">Score</div>
                <div class="hud-val" id="score-val">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Streak</div>
                <div class="hud-val" id="streak-val">0</div>
            </div>
        </div>

        <div class="game-container">
            <!-- Step Instructions -->
            <div class="task-panel">
                <div class="task-step" id="task-step">Step 1</div>
                <div class="task-text" id="task-text">Set 45 on the abacus</div>
                <div class="task-hint" id="task-hint">Move the beads to show 45.</div>
            </div>

            <!-- The Abacus -->
            <div class="abacus-wrapper">
                <div class="abacus-inner">
                    <div class="divider-beam"></div>
                    <div id="abacus-cols" style="display: flex; gap: 2px;">
                        <!-- Columns generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn-reset" id="btn-reset">Clear Abacus</button>
                <button class="btn-action" id="btn-submit">Submit Step</button>
            </div>
        </div>
    </div>

    <div id="notification">
        <h2 id="notif-msg">Correct! 🌟</h2>
    </div>

    <script src="abacus.js"></script>
</body>
</html>
