<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Splitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background-color: #064e3b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            margin: 0;
            background-image: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
        }

        .header { margin-top: 40px; text-align: center; }
        
        .game-area {
            position: relative;
            width: 600px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .slime-svg {
            width: 200px;
            height: 200px;
            animation: breathe 2s infinite alternate;
            transition: all 0.3s;
        }

        .slime-hp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px #000;
            z-index: 10;
        }

        @keyframes breathe {
            0% { transform: scale(1, 1); }
            100% { transform: scale(1.1, 0.9); }
        }

        .hit-anim {
            animation: hitSplash 0.5s forwards;
        }

        @keyframes hitSplash {
            0% { transform: scale(1); filter: brightness(2); }
            50% { transform: scale(1.5); filter: brightness(3); opacity: 1; }
            100% { transform: scale(0); filter: brightness(1); opacity: 0; }
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #10b981;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-box {
            width: 80px;
            background: #022c22;
            color: #34d399;
            border: 2px solid #10b981;
            border-radius: 10px;
            font-size: 2rem;
            text-align: center;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .exp-box {
            width: 60px;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn-fire {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b45309;
            margin-left: 20px;
        }
        .btn-fire:active { transform: translateY(6px); box-shadow: 0 0 0 #b45309; }

        .laser-beam {
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 20px;
            height: 0;
            background: #34d399;
            box-shadow: 0 0 20px #34d399;
            transform: translateX(-50%);
            transition: height 0.2s;
            z-index: 5;
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn" style="position: absolute; top: 20px; left: 20px;">🏠 Menu</a>
    
    <div class="header">
        <h1 style="color: #34d399; margin: 0;">SLIME SPLITTER</h1>
        <p style="color: #a7f3d0; margin-top: 5px;">Set your weapon's Base and Exponent to equal the Slime's HP!</p>
        <div style="font-size: 1.5rem; color: #fde047; margin-top: 10px;">Score: <span id="score">0</span></div>
    </div>

    <div class="game-area">
        <div style="position: relative;" id="slime-container">
            <svg class="slime-svg" id="slime" viewBox="0 0 100 100">
                <path d="M50,20 C80,20 90,60 90,80 C90,95 70,100 50,100 C30,100 10,95 10,80 C10,60 20,20 50,20 Z" fill="#10b981"/>
                <circle cx="35" cy="50" r="5" fill="black"/>
                <circle cx="65" cy="50" r="5" fill="black"/>
                <path d="M40,65 Q50,75 60,65" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="slime-hp" id="hp-display">64</div>
        </div>
        <div class="laser-beam" id="laser"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>Base</label>
            <input type="number" id="base-in" class="input-box" value="2">
        </div>
        <div style="font-size: 3rem; color: #10b981; padding-top: 20px;">^</div>
        <div class="input-group">
            <label>Exponent</label>
            <input type="number" id="exp-in" class="input-box exp-box" value="3">
        </div>
        <button class="btn-fire" id="btn-fire">FIRE!</button>
    </div>

    <script src="slime.js"></script>
</body>
</html>
