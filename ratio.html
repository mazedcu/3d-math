<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratio Apples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            height: auto !important;
            overflow-y: auto !important;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .header {
            margin-top: 60px; /* Reduced to pull things up */
            text-align: center;
            background: white;
            padding: 5px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #22c55e;
            z-index: 10;
        }

        .prompt {
            font-size: 1.5rem;
            font-weight: 700;
            color: #15803d;
            font-family: 'Outfit', sans-serif;
        }

        .ratio-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #22c55e;
            margin-top: 5px;
            font-family: 'Outfit', sans-serif;
        }

        .game-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            max-width: 900px;
            margin-top: 5px;
            position: relative;
        }

        .child-station {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .svg-container {
            width: 150px;
            height: 225px;
            position: relative;
        }

        /* SVG Character Animations */
        .arm-left {
            transform: translate(65px, 125px) rotate(0deg);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 57.5px 125px; /* local x=-7.5 mapped to SVG space, or better yet, just use transform-box */
            transform-box: fill-box;
            transform-origin: center top;
        }
        .arm-right {
            transform: translate(135px, 125px) rotate(0deg);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-box: fill-box;
            transform-origin: center top;
        }

        /* Happy: Clapping & Jumping */
        .happy { animation: jumpUp 0.3s infinite alternate cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .happy .arm-left { animation: clapLeft 0.3s infinite alternate; }
        .happy .arm-right { animation: clapRight 0.3s infinite alternate; }
        
        @keyframes jumpUp {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-20px); }
        }
        
        @keyframes clapLeft {
            0% { transform: translate(65px, 125px) rotate(10deg); }
            100% { transform: translate(65px, 125px) rotate(70deg); }
        }
        @keyframes clapRight {
            0% { transform: translate(135px, 125px) rotate(-10deg); }
            100% { transform: translate(135px, 125px) rotate(-70deg); }
        }
        
        /* Crying: Hands up, vibrating */
        .crying { animation: vibrateUpDown 0.1s infinite alternate; }
        .crying .arm-left { transform: translate(65px, 125px) rotate(150deg); }
        .crying .arm-right { transform: translate(135px, 125px) rotate(-150deg); }

        @keyframes vibrateUpDown {
            0% { transform: translateY(0px); }
            100% { transform: translateY(6px); }
        }

        .head { transition: transform 0.5s; }
        
        .happy-particles, .crying-particles {
            opacity: 0;
            transition: opacity 0.3s;
        }

        .happy .happy-particles {
            opacity: 1;
            animation: floatUp 1.5s infinite;
        }

        .crying .crying-particles {
            opacity: 1;
            animation: tearDrop 0.8s infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0.5); opacity: 0; }
        }

        @keyframes tearDrop {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }

        .basket {
            width: 120px;
            height: 60px;
            background: #b45309; /* Brown */
            border-radius: 10px 10px 40px 40px;
            border: 4px solid #78350f;
            position: relative;
            margin-top: -20px;
            z-index: 6;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        .basket-front {
            position: absolute;
            bottom: -4px;
            left: -4px;
            right: -4px;
            height: 40px;
            border-radius: 0 0 40px 40px;
            border: 4px solid #78350f;
            border-top: none;
            z-index: 10;
            pointer-events: none;
        }

        .input-group {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group input {
            width: 100px;
            height: 50px;
            font-size: 2rem;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
            color: #1e293b;
            z-index: 100;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .input-group input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
        }

        /* Central Pile */
        .center-station {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .big-basket {
            width: 200px;
            height: 80px;
            background: #b45309;
            border-radius: 10px 10px 60px 60px;
            border: 4px solid #78350f;
            position: relative;
            z-index: 2;
        }
        
        .big-basket-front {
            position: absolute;
            bottom: -4px;
            left: -4px;
            right: -4px;
            height: 50px;
            border-radius: 0 0 60px 60px;
            border: 4px solid #78350f;
            border-top: none;
            z-index: 10;
            pointer-events: none;
        }

        .apple {
            width: 30px;
            height: 30px;
            background: #ef4444;
            border-radius: 50%;
            position: absolute;
            border: 2px solid #b91c1c;
            box-shadow: inset -4px -4px 6px rgba(0,0,0,0.2);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
        }

        .apple::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 10px 0;
            transform: translateX(-50%) rotate(15deg);
            border: 1px solid #15803d;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            z-index: 20;
        }

        .btn-give {
            background: #22c55e;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #16a34a, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            font-family: 'Outfit', sans-serif;
        }

        .btn-give:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #16a34a, 0 5px 10px rgba(0,0,0,0.2);
        }
        
        .btn-give:disabled {
            background: #94a3b8;
            box-shadow: 0 8px 0 #64748b;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-next {
            background: #3b82f6;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2563eb, 0 15px 20px rgba(0,0,0,0.2);
            font-family: 'Outfit', sans-serif;
            display: none;
        }
        .btn-next:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2563eb;
        }

        #nav-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Outfit', sans-serif;
        }
        
        .error-msg {
            position: absolute;
            top: 150px;
            color: #ef4444;
            font-weight: bold;
            font-size: 1.5rem;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ef4444;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn" id="nav-btn" style="text-decoration:none; z-index: 50;">🏠 Menu</a>

    <!-- Top HUD -->
    <div id="hud" class="hud" style="justify-content: flex-end; top: 5px;">
        <div class="hud-left" style="background: rgba(255,255,255,0.9); padding: 5px 20px; border-radius: 20px; border: 2px solid #cbd5e1; gap: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <div class="stat accent" style="border: none; background: transparent; padding: 0;">
                <div class="stat-val" id="score-p1" style="color: #3b82f6;">0</div>
                <div class="stat-lbl" style="color: #3b82f6;">Player 1</div>
            </div>
            
            <div class="stat" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div style="font-size: 1rem; font-weight: 800; color: #3b82f6; letter-spacing: 1px;" id="turn-indicator">P1'S TURN</div>
                <div style="font-size: 0.7rem; font-weight: 600; color: #64748b; margin-top: 2px;">Try <span id="try-count">1</span> / 5</div>
            </div>

            <div class="stat accent" style="border: none; background: transparent; padding: 0;">
                <div class="stat-val" id="score-p2" style="color: #f43f5e;">0</div>
                <div class="stat-lbl" style="color: #f43f5e;">Player 2</div>
            </div>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div class="overlay visible" id="announcement-overlay">
        <div class="count-box">
            <div class="count-emoji" id="announce-emoji">🎮</div>
            <div class="count-title" id="announce-title" style="font-size: 2rem; color: #3b82f6;">PLAYER 1</div>
            <div class="count-result" id="announce-subtitle" style="margin-bottom: 20px; color: rgba(0,0,0,0.7); font-size: 1.1rem;">
                Get ready for your 5 tries!
            </div>
            <button class="btn primary" id="btn-start" style="width: 100%">START</button>
        </div>
    </div>

    <div class="header">
        <div class="prompt" id="prompt-text">Divide <span id="total-apples">15</span> apples in ratio:</div>
        <div class="ratio-display" id="ratio-text">1 : 2</div>
    </div>
    
    <div id="error-msg" class="error-msg">Incorrect. Try again!</div>

    <div class="game-area">
        <!-- Boy -->
        <div class="child-station" id="station-boy">
            <div class="svg-container" id="svg-boy">
                <svg viewBox="0 0 200 300" width="100%" height="100%">
                    <!-- Particles -->
                    <g class="happy-particles" fill="#fbbf24">
                        <circle cx="50" cy="50" r="5"/>
                        <circle cx="150" cy="60" r="4"/>
                        <circle cx="100" cy="30" r="6"/>
                    </g>
                    <!-- Tears moved to bottom to render on top of face -->

                    <!-- Body (Thobe) -->
                    <path d="M 70 120 L 130 120 L 140 280 L 60 280 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                    
                    <!-- Arms -->
                    <g class="arm-left" transform="translate(65, 125)">
                        <rect x="-15" y="0" width="15" height="70" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                        <circle cx="-7.5" cy="70" r="8" fill="#fcd34d"/> <!-- Hand -->
                    </g>
                    <g class="arm-right" transform="translate(135, 125)">
                        <rect x="0" y="0" width="15" height="70" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                        <circle cx="7.5" cy="70" r="8" fill="#fcd34d"/> <!-- Hand -->
                    </g>

                    <!-- Head & Kufi -->
                    <g class="head" transform="translate(100, 80)">
                        <circle cx="0" cy="0" r="35" fill="#fcd34d"/> <!-- Face -->
                        <path d="M -30 -15 Q 0 -40 30 -15 L 30 -5 Q 0 5 -30 -5 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/> <!-- Kufi -->
                    </g>
                    
                    <!-- Tears -->
                    <g class="crying-particles" fill="#3b82f6">
                        <!-- Left Eye Tear -->
                        <path d="M 75 70 Q 80 80 75 90 Q 70 80 75 70" />
                        <circle cx="75" cy="100" r="3" />
                        <!-- Right Eye Tear -->
                        <path d="M 125 70 Q 130 80 125 90 Q 120 80 125 70" />
                        <circle cx="125" cy="100" r="3" />
                    </g>
                </svg>
            </div>
            <div class="basket" id="basket-boy">
                <div class="basket-front"></div>
            </div>
            <div class="input-group">
                <input type="number" id="input-boy" min="0" max="50" placeholder="?">
            </div>
        </div>

        <!-- Center Pile -->
        <div class="center-station">
            <div class="big-basket" id="center-basket">
                <div class="big-basket-front"></div>
                <!-- Apples injected here -->
            </div>
        </div>

        <!-- Girl -->
        <div class="child-station" id="station-girl">
            <div class="svg-container" id="svg-girl">
                <svg viewBox="0 0 200 300" width="100%" height="100%">
                    <!-- Particles -->
                    <g class="happy-particles" fill="#fbbf24">
                        <circle cx="50" cy="50" r="5"/>
                        <circle cx="150" cy="60" r="4"/>
                        <circle cx="100" cy="30" r="6"/>
                    </g>
                    <!-- Tears moved to bottom to render on top of hijab -->

                    <!-- Body (Abaya) -->
                    <path d="M 70 120 L 130 120 L 150 280 L 50 280 Z" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
                    
                    <!-- Arms -->
                    <g class="arm-left" transform="translate(65, 125)">
                        <rect x="-15" y="0" width="15" height="70" rx="7" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
                        <circle cx="-7.5" cy="70" r="8" fill="#fcd34d"/> <!-- Hand -->
                    </g>
                    <g class="arm-right" transform="translate(135, 125)">
                        <rect x="0" y="0" width="15" height="70" rx="7" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
                        <circle cx="7.5" cy="70" r="8" fill="#fcd34d"/> <!-- Hand -->
                    </g>

                    <!-- Head & Hijab -->
                    <g class="head" transform="translate(100, 80)">
                        <!-- Hijab Background -->
                        <path d="M -35 -10 Q -45 50 -20 70 Q 0 80 20 70 Q 45 50 35 -10 Q 30 -45 0 -45 Q -30 -45 -35 -10 Z" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
                        <!-- Inner face cutout of Hijab -->
                        <circle cx="0" cy="5" r="26" fill="#fcd34d"/>
                        <!-- Forehead cover -->
                        <path d="M -26 5 A 26 26 0 0 1 26 5 L 35 -10 Q 0 -45 -35 -10 Z" fill="#a78bfa"/> 
                    </g>
                    
                    <!-- Tears -->
                    <g class="crying-particles" fill="#3b82f6">
                        <!-- Left Eye Tear -->
                        <path d="M 75 70 Q 80 80 75 90 Q 70 80 75 70" />
                        <circle cx="75" cy="100" r="3" />
                        <!-- Right Eye Tear -->
                        <path d="M 125 70 Q 130 80 125 90 Q 120 80 125 70" />
                        <circle cx="125" cy="100" r="3" />
                    </g>
                </svg>
            </div>
            <div class="basket" id="basket-girl">
                <div class="basket-front"></div>
            </div>
            <div class="input-group">
                <input type="number" id="input-girl" min="0" max="50" placeholder="?">
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-give" id="btn-give">Give Apples</button>
        <button class="btn-next" id="btn-next">Next Round</button>
    </div>

    <script src="ratio.js"></script>
</body>
</html>
