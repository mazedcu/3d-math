<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numberfield - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <nav class="navbar">
        <div class="nav-brand">Admin Dashboard</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">View Site</a>
            <a href="#" class="nav-link" id="adminLogoutBtn" onclick="doAdminLogout()" style="display:none; color:var(--danger);">Logout</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1400px; display: none;" id="adminDashboard">
        <h2 class="section-title" style="text-align: left; margin-bottom: 20px;">Admin Management</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('transactions')">Transactions</button>
            <button class="tab-btn" onclick="switchTab('users')">Users</button>
            <button class="tab-btn" onclick="switchTab('games')">Games</button>
        </div>

        <div id="transactions" class="tab-content active">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Transaction ID</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                        <!-- Data populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="users" class="tab-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Days Left</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Data populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="games" class="tab-content">
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Admin access &mdash; play any game directly. Links open in a new tab.</p>
            <div class="games-grid" id="adminGamesGrid">
                <!-- Game cards populated via JS -->
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h3 style="margin-bottom: 20px; font-size: 1.5rem;">Admin Login</h3>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="adminUser" class="form-control" placeholder="Admin username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="adminPass" class="form-control" placeholder="Admin password">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="doAdminLogin()">Login</button>
            </div>
            <p id="adminLoginError" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem; display: none;"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', checkAdminAuth);

        function checkAdminAuth() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                document.getElementById('adminLoginModal').style.display = 'flex';
                document.getElementById('adminDashboard').style.display = 'none';
                document.getElementById('adminLogoutBtn').style.display = 'none';
            } else {
                document.getElementById('adminLoginModal').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('adminLogoutBtn').style.display = 'block';
                fetchTransactions();
                fetchUsers();
            }
        }

        async function doAdminLogin() {
            const username = document.getElementById('adminUser').value.trim();
            const password = document.getElementById('adminPass').value.trim();
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    checkAdminAuth();
                } else {
                    document.getElementById('adminLoginError').innerText = data.error || 'Login failed';
                    document.getElementById('adminLoginError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('adminLoginError').innerText = 'Server connection error';
                document.getElementById('adminLoginError').style.display = 'block';
            }
        }

        function doAdminLogout() {
            localStorage.removeItem('adminToken');
            checkAdminAuth();
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('adminToken');
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'transactions') fetchTransactions();
            if (tabId === 'users') fetchUsers();
            if (tabId === 'games') renderAdminGames();
        }

        const ALL_GAMES = [
            { f: 'bomb.html', e: '\u{1F4A3}', n: 'BOMB DEFUSAL' },
            { f: 'train.html', e: '\u{1F682}', n: 'TRAIN CONDUCTOR' },
            { f: 'submarine.html', e: '\u2693', n: 'SUBMARINE DEPTHS' },
            { f: 'lcm.html', e: '\u{1F438}', n: 'FROG LCM' },
            { f: 'blob.html', e: '\u{1F535}', n: 'BLOBMERGE' },
            { f: 'unitary.html', e: '🍎', n: 'FRUIT SHOP' },
            { f: 'snake.html', e: '\u{1F40D}', n: 'MATH SNAKE' },
            { f: 'wormhole.html', e: '\u{1F300}', n: 'WORMHOLE' },
            { f: 'race.html', e: '\u{1F3CE}\uFE0F', n: 'MATH RACE' },
            { f: 'plane.html', e: '\u2708\uFE0F', n: 'BIPLANE MULTIPLES' },
            { f: 'marbles.html', e: '\u{1F52E}', n: 'MARBLE PROBABILITY' },
            { f: 'cylinder.html', e: '\u{1F9EA}', n: 'CYLINDER MIXER' },
            { f: 'ratio-ninja.html', e: '\u2694\uFE0F', n: 'RATIO NINJA' },
            { f: 'aliens.html', e: '\u{1F47E}', n: 'MATH ALIEN' },
            { f: 'bridge.html', e: '\u{1F309}', n: 'FRACTION BRIDGE' },
            { f: 'ratio.html', e: '\u{1F34E}', n: 'RATIO APPLES' },
            { f: 'space.html', e: '\u{1F680}', n: 'PERCENT SPACE LAUNCH' },
            { f: 'recipe.html', e: '\u{1F373}', n: 'RECIPE RATIO' },
            { f: 'balance.html', e: '\u2696\uFE0F', n: 'BALANCE SCALE' },
            { f: 'slime.html', e: '\u{1F9A0}', n: 'SLIME SPLITTER' },
            { f: 'abacus.html', e: '\u{1F9EE}', n: 'VIRTUAL ABACUS' },
            { f: 'crystal.html', e: '\u{1F48E}', n: 'CRYSTAL CARVER' },
            { f: 'laser.html', e: '\u{1FA9E}', n: 'LASER MIRRORS' },
            { f: 'tiles.html', e: '\u{1F9F1}', n: 'TILE MATH' },
            { f: 'missile.html', e: '\u{1F680}', n: 'DESTROY THE SHIP' },
            { f: 'cannon.html', e: '\u{1F3AF}', n: 'ANGLE CANNON' },
            { f: 'ship-battle.html', e: '\u2693', n: 'SHIP BATTLE' },
            { f: 'tank-battle.html', e: '\u{1F6E1}\uFE0F', n: 'TANK BATTLE' },
            { f: 'algebra-tiles.html', e: '\u{1F9EE}', n: 'ALGEBRA TILES' },
        ];

        function renderAdminGames() {
            const grid = document.getElementById('adminGamesGrid');
            if (grid.dataset.rendered) return;
            grid.innerHTML = ALL_GAMES.map(g => `
                <a href="${g.f}" target="_blank" rel="noopener" class="card game-card" style="text-decoration:none; color:var(--text-primary); display:block; text-align:center;">
                    <div style="font-size: 3rem; margin-bottom: 10px;">${g.e}</div>
                    <h4 style="font-size: 1.1rem;">${g.n}</h4>
                </a>
            `).join('');
            grid.dataset.rendered = '1';
        }

        async function fetchTransactions() {
            try {
                const res = await fetch('/api/admin/transactions', { headers: getAuthHeaders() });
                if (res.status === 401) {
                    doAdminLogout();
                    return;
                }
                
                const transactions = await res.json();
                const tbody = document.getElementById('transactionsTableBody');
                tbody.innerHTML = '';
                
                transactions.forEach(t => {
                    const row = document.createElement('tr');
                    
                    const d = new Date(t.created_at);
                    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
                    
                    let statusClass = 'status-pending';
                    if (t.status === 'approved') statusClass = 'status-approved';
                    if (t.status === 'rejected') statusClass = 'status-rejected';

                    let actionsHtml = '';
                    if (t.status === 'pending') {
                        actionsHtml = `
                            <button class="btn btn-outline btn-small" style="color: var(--success); border-color: var(--success);" onclick="processTransaction(${t.id}, 'approve')">Approve</button>
                            <button class="btn btn-outline btn-small" style="color: var(--danger); border-color: var(--danger);" onclick="processTransaction(${t.id}, 'reject')">Reject</button>
                        `;
                    } else {
                        actionsHtml = '<span style="color: var(--text-secondary); font-size: 0.8rem;">Processed</span>';
                    }

                    row.innerHTML = `
                        <td>#${t.id}</td>
                        <td>${t.name}</td>
                        <td>${t.email}</td>
                        <td style="text-transform: capitalize;">${t.plan}</td>
                        <td style="font-family: var(--font-mono);">${t.trx_id}</td>
                        <td><span class="status-badge ${statusClass}">${t.status}</span></td>
                        <td style="color: var(--text-secondary); font-size: 0.9rem;">${dateStr}</td>
                        <td class="action-btns">${actionsHtml}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to load transactions", err);
            }
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users', { headers: getAuthHeaders() });
                if (res.status === 401) {
                    doAdminLogout();
                    return;
                }
                
                const users = await res.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                
                users.forEach(u => {
                    const row = document.createElement('tr');
                    
                    let statusClass = u.status === 'active' ? 'status-approved' : 'status-rejected';
                    
                    row.innerHTML = `
                        <td>#${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td><span class="status-badge ${statusClass}">${u.status}</span></td>
                        <td><strong style="color: var(--accent);">${u.days_left}</strong> days</td>
                        <td class="action-btns">
                            <button class="btn btn-outline btn-small" style="color: var(--danger); border-color: var(--danger); padding: 5px 10px; font-size: 0.8rem;" onclick="deleteUser(${u.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to load users", err);
            }
        }

        async function processTransaction(id, action) {
            if (!confirm(`Are you sure you want to ${action} transaction #${id}?`)) return;
            
            try {
                const res = await fetch(`/api/admin/transactions/${id}/${action}`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                
                if (res.status === 401) {
                    doAdminLogout();
                    return;
                }
                
                if (res.ok) {
                    fetchTransactions(); // Refresh
                } else {
                    const data = await res.json();
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Server connection error.");
            }
        }

        async function deleteUser(id) {
            if (!confirm(`Are you sure you want to completely delete user #${id} and all their transactions? This cannot be undone.`)) return;

            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.status === 401) {
                    doAdminLogout();
                    return;
                }

                if (res.ok) {
                    fetchUsers(); // Refresh
                } else {
                    const data = await res.json();
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Server connection error.");
            }
        }
    </script>
</body>
</html>
