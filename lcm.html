<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM Frog Jump — Number Line Game</title>
    <meta name="description" content="Watch two frogs jump on a number line and predict where they first land together. Learn LCM!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background: #0f172a;
            color: white;
            overflow: hidden;
        }
        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        /* HUD override for dark theme */
        .stat { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        .stat-val { color: #a78bfa; }
        .stat-lbl { color: rgba(255,255,255,0.5); }
        .stat.accent { background: rgba(255,255,255,0.12); border-color: rgba(16,185,129,0.3); }
        .stat.accent .stat-val { color: #34d399; }

        .title { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }

        .btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); color: white; }
        .btn:hover { background: rgba(255,255,255,0.15); }

        .frog-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .frog-info .frog-emoji { font-size: 1.4rem; }
        .frog-info.green .jump-val { color: #34d399; }
        .frog-info.red .jump-val { color: #f87171; }
        .jump-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem; }

        .answer-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .answer-label {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }
        .answer-input {
            width: 100px;
            padding: 10px 14px;
            font-size: 1.3rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-align: center;
        }
        .answer-input:focus {
            outline: none;
            border-color: #a78bfa;
        }
        .answer-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(124,58,237,0.4);
        }
        .answer-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
        .answer-btn:active { transform: translateY(0); }

        .jump-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(16,185,129,0.4);
        }
        .jump-btn:hover { transform: translateY(-2px); }
        .jump-btn:active { transform: translateY(0); }

        .notify { background: rgba(15,23,42,0.9); border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hud">
        <div class="hud-left">
            <div class="stat accent">
                <div class="stat-val" id="s-score">0</div>
                <div class="stat-lbl">Score</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="s-round">1</div>
                <div class="stat-lbl">Round</div>
            </div>
            <div class="frog-info green">
                <span class="frog-emoji">
                    <svg viewBox="0 0 50 50" width="1em" height="1em" style="vertical-align: middle;">
                        <circle cx="17" cy="15" r="6" fill="#34d399" />
                        <circle cx="33" cy="15" r="6" fill="#34d399" />
                        <ellipse cx="25" cy="25" rx="20" ry="14" fill="#34d399" />
                        <ellipse cx="25" cy="29" rx="14" ry="8" fill="#059669" />
                    </svg>
                </span>
                <span>Jumps by <span class="jump-val" id="jump-a">3</span></span>
            </div>
            <div class="frog-info red">
                <span class="frog-emoji">
                    <svg viewBox="0 0 50 50" width="1em" height="1em" style="vertical-align: middle;">
                        <circle cx="17" cy="15" r="6" fill="#f87171" />
                        <circle cx="33" cy="15" r="6" fill="#f87171" />
                        <ellipse cx="25" cy="25" rx="20" ry="14" fill="#f87171" />
                        <ellipse cx="25" cy="29" rx="14" ry="8" fill="#dc2626" />
                    </svg>
                </span>
                <span>Jumps by <span class="jump-val" id="jump-b">4</span></span>
            </div>
        </div>
        <div class="hud-right">
            <h1 class="title"><span class="t1" style="color:#34d399;">FROG</span><span class="t2" style="color:#a78bfa;">LCM</span></h1>
            <button class="btn" id="btn-new">🔄 New Round</button>
            <a href="index.html" class="btn" style="text-decoration:none; display:flex; align-items:center;">🏠 Menu</a>
        </div>
    </div>

    <!-- Answer Panel -->
    <div class="answer-panel" id="answer-panel">
        <span class="answer-label">First number they both land on?</span>
        <input type="number" id="answer-input" class="answer-input" min="1" placeholder="?" autocomplete="off">
        <button class="answer-btn" id="btn-check">CHECK ✓</button>
        <button class="jump-btn" id="btn-jump">
            <svg viewBox="0 0 50 50" width="1em" height="1em" style="vertical-align: middle;">
                <circle cx="17" cy="15" r="6" fill="#34d399" />
                <circle cx="33" cy="15" r="6" fill="#34d399" />
                <ellipse cx="25" cy="25" rx="20" ry="14" fill="#34d399" />
                <ellipse cx="25" cy="29" rx="14" ry="8" fill="#059669" />
            </svg> JUMP
        </button>
    </div>

    <!-- Notification -->
    <div class="notify" id="notify">
        <span id="notify-text">Correct!</span>
    </div>

    <!-- Hurray overlay -->
    <div class="hurray" id="hurray">
        <div class="hurray-text" id="hurray-text">🎉 CORRECT!</div>
    </div>

    <script src="lcm.js"></script>
</body>
</html>
