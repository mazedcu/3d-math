<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormhole 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body { background: #000; }

        .stat-score { border-color: rgba(0, 255, 102, 0.3); background: rgba(0, 20, 5, 0.7); }
        .stat-score .stat-val { color: #00ff66; }
        .stat-score .stat-lbl { color: rgba(0, 255, 102, 0.5); }

        .stat-lives { border-color: rgba(244, 63, 94, 0.3); background: rgba(20, 0, 5, 0.7); }
        .stat-lives .stat-val { color: var(--rose); }
        .stat-lives .stat-lbl { color: rgba(244, 63, 94, 0.5); }

        .stat-time { border-color: rgba(0, 255, 102, 0.3); background: rgba(0, 20, 5, 0.7); }
        .stat-time .stat-val { color: #b3ffd1; }
        .stat-time .stat-lbl { color: rgba(0, 255, 102, 0.5); }

        .title { background: rgba(0, 20, 5, 0.7); border-color: rgba(0,255,102,0.25); }

        /* Start panel, bottom-left */
        #start-screen {
            position: fixed; bottom: 28px; left: 24px; z-index: 300;
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(0, 15, 4, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 18px;
            padding: 16px 20px; max-width: 320px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            transition: opacity 0.4s, transform 0.4s;
        }
        #start-screen.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
        .ss-title { font-size: 1.1rem; font-weight: 800; color: #00ff66; font-family: var(--fm); }
        .ss-desc { font-size: 0.78rem; color: rgba(179, 255, 209, 0.8); line-height: 1.6; }
        .ss-btn {
            font-size: 1rem; font-weight: 800; padding: 12px 20px;
            border-radius: 12px; cursor: pointer; border: 1px solid #00ff66;
            background: rgba(0, 255, 102, 0.15); color: #00ff66;
            font-family: var(--fm); letter-spacing: 2px;
            transition: all 0.15s;
        }
        .ss-btn:hover { background: rgba(0, 255, 102, 0.35); transform: scale(1.03); }

        /* Hit flash */
        #flash {
            position: fixed; inset: 0; z-index: 90; pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(244, 63, 94, 0.55) 100%);
            opacity: 0; transition: opacity 0.4s;
        }
        #flash.on { opacity: 1; transition: opacity 0.05s; }

        /* Game Over */
        #game-over {
            position: fixed; inset: 0; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 8, 2, 0.88); backdrop-filter: blur(12px);
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        #game-over.show { opacity: 1; pointer-events: all; }
        .go-title { font-size: 4rem; font-weight: 900; margin-bottom: 16px; font-family: var(--fm); }
        .go-title.win { color: #00ff66; text-shadow: 0 0 30px rgba(0,255,102,0.6); }
        .go-title.lose { color: var(--rose); text-shadow: 0 0 30px rgba(244,63,94,0.6); }
        .go-desc { font-size: 1.1rem; color: #b3ffd1; margin-bottom: 30px; text-align: center; max-width: 420px; line-height: 1.6; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="flash"></div>

    <!-- HUD -->
    <div id="hud" class="hud">
        <div class="hud-left">
            <div class="stat stat-score">
                <div class="stat-val" id="s-score">0</div>
                <div class="stat-lbl">Score</div>
            </div>
            <div class="stat stat-lives">
                <div class="stat-val" id="s-lives">♥♥♥</div>
                <div class="stat-lbl">Lives</div>
            </div>
            <div class="stat stat-time">
                <div class="stat-val" id="s-time">60</div>
                <div class="stat-lbl">Seconds Left</div>
            </div>
        </div>
        <div class="hud-right">
            <h1 class="title"><span style="color:#00ff66">WORM</span><span style="color:#b3ffd1">HOLE</span></h1>
            <a href="index.html" class="btn" style="text-decoration:none; display:flex; align-items:center;">🏠 Menu</a>
        </div>
    </div>

    <!-- Start -->
    <div id="start-screen">
        <div class="ss-title">ENTER THE WORMHOLE</div>
        <div class="ss-desc">
            🖱️ Move your mouse to fly through the tunnel.<br>
            ☠️ AVOID <strong style="color:#f43f5e">PRIME</strong> numbers (2, 3, 5, 7, 11...) — they cost a life!<br>
            💚 Fly through non-prime numbers for points.<br>
            Survive 60 seconds with 3 lives.
        </div>
        <button class="ss-btn" id="btn-start">▶ JACK IN</button>
    </div>

    <!-- Game Over -->
    <div id="game-over">
        <div class="go-title win" id="go-title">YOU MADE IT</div>
        <div class="go-desc" id="go-desc"></div>
        <button class="btn primary" onclick="location.reload()" style="font-size:1.1rem; padding: 14px 30px;">Re-enter</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="wormhole.js?v=3"></script>
</body>
</html>
