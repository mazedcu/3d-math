<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Defusal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background-color: #1e1b4b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            margin: 0;
            background-image: radial-gradient(circle at center, #312e81 0%, #111827 100%);
        }

        .header { margin-top: 40px; text-align: center; }

        .bomb-container {
            position: relative;
            width: 600px;
            height: 450px;
            background: #1f2937;
            border: 8px solid #374151;
            border-radius: 30px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.5);
        }

        .display {
            background: #000;
            border: 4px solid #111;
            border-radius: 10px;
            width: 95%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            color: #ef4444;
            text-shadow: 0 0 15px #ef4444;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .wires-area {
            display: flex;
            gap: 40px;
            width: 100%;
            justify-content: center;
        }

        .wire-btn {
            position: relative;
            width: 60px;
            height: 150px;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: transform 0.2s;
        }
        .wire-btn:hover { transform: scale(1.1); }

        .wire-svg {
            width: 100%;
            height: 100%;
        }

        .wire-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: #374151;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .cut-anim {
            clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%, 0 60%, 100% 60%, 100% 100%, 0 100%);
        }

        .explosion {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }
        .boom { animation: boomAnim 1s ease-out forwards; }
        
        @keyframes boomAnim {
            0% { opacity: 1; background: white; }
            30% { background: #f59e0b; }
            100% { opacity: 0; background: #ef4444; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn" style="position: absolute; top: 20px; left: 20px;">🏠 Menu</a>
    
    <div class="header">
        <h1 style="color: #ef4444; margin: 0;">BOMB DEFUSAL</h1>
        <p style="color: #9ca3af; margin-top: 5px;">Cut the wire of the operation that must be done FIRST (PEMDAS)!</p>
        <div style="font-size: 1.5rem; color: #fde047; margin-top: 10px;">Score: <span id="score">0</span></div>
    </div>

    <div class="bomb-container" id="bomb">
        <div class="display" id="equation">5 + 3 × 2</div>
        <div class="wires-area" id="wires">
            <!-- Wires injected by JS -->
        </div>
    </div>

    <div class="explosion" id="explosion"></div>

    <script src="bomb.js"></script>
</body>
</html>
