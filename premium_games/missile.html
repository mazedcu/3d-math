<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destroy The Ship — Coordinate Grid Game</title>
    <meta name="description" content="Type the coordinates of the enemy ship to fire your anti-ship missile. Don't misfire!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .coord-input {
            width: 80px;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }
        .coord-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .coord-label {
            font-weight: bold;
            font-size: 1.2rem;
            width: 30px;
            text-align: right;
        }
        .x-label { color: #f87171; } /* Red for X */
        .y-label { color: #34d399; } /* Green for Y */
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="hud" class="hud">
        <div class="hud-left">
            <div class="stat accent" style="--accent-color: #3b82f6;">
                <div class="stat-val" id="s-score">0</div>
                <div class="stat-lbl">Ships Destroyed</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="s-misfires">0</div>
                <div class="stat-lbl">Misfires</div>
            </div>
        </div>
        <div class="hud-right" style="flex-direction: column; align-items: flex-end;">
            <h1 class="title" style="text-align: right;"><span class="t1" style="color: #60a5fa;">DESTROY </span><span class="t2" style="color: #93c5fd;">THE SHIP</span></h1>
            
            <div class="input-group">
                <span class="coord-label x-label">X:</span>
                <input type="number" id="input-x" class="coord-input" step="1" min="0" max="20" placeholder="0">
            </div>
            <div class="input-group">
                <span class="coord-label y-label">Y:</span>
                <input type="number" id="input-y" class="coord-input" step="1" min="0" max="20" placeholder="0">
            </div>

            <button class="btn" id="btn-fire" style="background: linear-gradient(135deg,#ef4444,#dc2626); color: white; border: none; box-shadow: 0 4px 16px rgba(220,38,38,0.4); margin-top: 10px; width: 100%;">🚀 FIRE MISSILE</button>
            <a href="index.html" class="btn" style="text-decoration:none; display:flex; align-items:center; justify-content:center; margin-top: 10px;">🏠 Menu</a>
        </div>
    </div>

    <!-- Notification -->
    <div class="notify" id="notify">
        <span id="notify-text">Target Hit!</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="missile.js"></script>
</body>
</html>
