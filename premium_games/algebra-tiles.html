<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Tiles — Solve Equations</title>
    <meta name="description" content="Use drag-and-drop algebra tiles to build and solve algebraic equations!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0d0221 0%, #1a0533 50%, #0a1628 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0 12px 24px;
        }

        /* HUD */
        #hud {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            gap: 10px;
        }

        .hud-pill {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 8px 20px;
            text-align: center;
        }
        .hud-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1.5px; }
        .hud-val   { font-size: 1.6rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        #score-val  { color: #fbbf24; }
        #streak-val { color: #34d399; }

        .back-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }

        /* Problem Card */
        #problem-card {
            width: 100%;
            max-width: 820px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 18px 28px;
            text-align: center;
            box-shadow: 0 0 40px rgba(139,92,246,0.15);
            margin-bottom: 14px;
        }
        .problem-label { font-size: 0.8rem; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
        #problem-eq {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #c084fc, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .problem-hint { font-size: 0.9rem; color: rgba(255,255,255,0.45); margin-top: 6px; }

        /* Step Bar */
        #step-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 820px;
            margin-bottom: 12px;
        }
        .step-pill {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }
        .step-pill.active  { background: rgba(139,92,246,0.25); border-color: #a855f7; color: #c084fc; }
        .step-pill.done    { background: rgba(52,211,153,0.15); border-color: #34d399; color: #34d399; }

        /* Equation Workspace */
        #workspace {
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ws-panel {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 18px;
            min-height: 130px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .ws-panel.drag-over {
            border-color: #a855f7;
            background: rgba(139,92,246,0.1);
        }
        .ws-panel.correct-glow { border-color: #34d399 !important; box-shadow: 0 0 20px rgba(52,211,153,0.3); }
        .ws-panel.wrong-glow   { border-color: #f87171 !important; box-shadow: 0 0 20px rgba(248,113,113,0.3); }

        .ws-label {
            position: absolute;
            top: 6px;
            left: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ws-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: rgba(255,255,255,0.5);
            padding: 0 4px;
            flex-shrink: 0;
        }

        /* Tiles in workspace */
        .placed-tile {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            transition: transform 0.15s, opacity 0.15s;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.35);
            margin-top: 20px;
        }
        .placed-tile:hover { transform: scale(1.05); opacity: 0.85; }
        .placed-tile .remove-btn {
            position: absolute;
            top: -6px; right: -6px;
            width: 16px; height: 16px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #f87171;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .placed-tile:hover .remove-btn { opacity: 1; }

        /* Tile colors */
        .tile-x   { background: linear-gradient(135deg, #6d28d9, #a855f7); color: #fff; width: 44px; height: 115px; font-size: 0.95rem; }
        .tile-nx  { background: linear-gradient(135deg, #7f1d1d, #ef4444); color: #fff; width: 44px; height: 115px; font-size: 0.95rem; }
        .tile-1   { background: linear-gradient(135deg, #065f46, #10b981); color: #fff; width: 44px; height: 44px; font-size: 1rem; }
        .tile-n1  { background: linear-gradient(135deg, #7c2d12, #f97316); color: #fff; width: 44px; height: 44px; font-size: 1rem; }

        /* RHS pre-filled tiles */
        .rhs-tile {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #fff;
            width: 36px; height: 36px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        /* Tile Tray */
        #tray-section {
            width: 100%;
            max-width: 820px;
            margin-bottom: 12px;
        }
        .tray-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        #tile-tray {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            gap: 14px;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tray-tile {
            cursor: grab;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: none;
        }
        .tray-tile:hover { transform: translateY(-4px); }
        .tray-tile:active { cursor: grabbing; }
        .tray-tile-body {
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .tray-tile-name { font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 1px; }

        .tray-x  .tray-tile-body { background: linear-gradient(135deg, #6d28d9, #a855f7); color: #fff; width: 46px; height: 120px; font-size: 1.1rem; }
        .tray-nx .tray-tile-body { background: linear-gradient(135deg, #7f1d1d, #ef4444); color: #fff; width: 46px; height: 120px; font-size: 1.1rem; }
        .tray-1  .tray-tile-body { background: linear-gradient(135deg, #065f46, #10b981); color: #fff; width: 46px; height: 46px; font-size: 1.2rem; }
        .tray-n1 .tray-tile-body { background: linear-gradient(135deg, #7c2d12, #f97316); color: #fff; width: 46px; height: 46px; font-size: 1.2rem; }

        /* Floating drag ghost */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: translate(-50%, -50%);
            display: none;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        /* Answer area */
        #answer-area {
            width: 100%;
            max-width: 820px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .answer-label { font-size: 1.1rem; font-weight: 700; color: rgba(255,255,255,0.7); flex-shrink: 0; }
        #x-equals { font-size: 1.5rem; font-weight: 800; color: #c084fc; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
        #answer-input {
            width: 100px;
            height: 52px;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fbbf24;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        #answer-input:focus { border-color: #a855f7; }

        .btn-check {
            flex: 1;
            min-width: 140px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16,185,129,0.3);
            transition: all 0.15s;
        }
        .btn-check:active { transform: translateY(6px); box-shadow: 0 0 0 #047857; }

        .btn-reset-ws {
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.6);
        }
        .btn-reset-ws:hover { background: rgba(255,255,255,0.12); }

        #feedback-msg {
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 0 0;
            text-align: center;
        }
        #feedback-msg.correct { color: #34d399; }
        #feedback-msg.wrong   { color: #f87171; }

        /* Hurray overlay */
        #hurray-overlay {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #hurray-overlay.show { opacity: 1; pointer-events: auto; }
        #hurray-box {
            background: rgba(10,5,30,0.95);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 44px 60px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }
        #hurray-overlay.show #hurray-box { transform: scale(1); }
        .hurray-emoji { font-size: 4rem; }
        .hurray-title {
            font-size: 3rem; font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #34d399, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 5px;
        }
        .hurray-sub  { font-size: 1.1rem; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
        .hurray-pts  { font-size: 1.5rem; font-weight: 700; color: #fbbf24; font-family: 'JetBrains Mono', monospace; }

        #wrong-flash {
            position: fixed; inset: 0;
            background: rgba(239,68,68,0.25);
            pointer-events: none;
            opacity: 0;
            z-index: 400;
            transition: opacity 0.15s;
        }
        #wrong-flash.show { opacity: 1; }

        @keyframes slow-vanish {
            0%   { transform: scale(1); opacity: 1; filter: brightness(1); }
            40%  { transform: scale(1.15); opacity: 0.9; filter: brightness(1.5); box-shadow: 0 0 20px rgba(255,255,255,0.8); }
            100% { transform: scale(0); opacity: 0; filter: brightness(2); }
        }
        .animating-vanish {
            animation: slow-vanish 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 600px) {
            #problem-eq { font-size: 1.8rem; }
            .tray-x .tray-tile-body, .tray-nx .tray-tile-body { width: 38px; height: 95px; }
            .tray-1 .tray-tile-body, .tray-n1 .tray-tile-body { width: 38px; height: 38px; }
            #workspace { flex-direction: column; }
            .ws-divider { flex-direction: row; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="wrong-flash"></div>

    <div id="app">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-pill">
                <div class="hud-label">Score</div>
                <div class="hud-val" id="score-val">0</div>
            </div>
            <a href="index.html" class="back-btn" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="hud-pill">
                <div class="hud-label">Streak 🔥</div>
                <div class="hud-val" id="streak-val">0</div>
            </div>
        </div>

        <!-- Problem -->
        <div id="problem-card">
            <div class="problem-label">Solve for x</div>
            <div id="problem-eq">2x + 1 = 7</div>
            <div class="problem-hint" id="problem-hint">Isolate x by dragging tiles to balance and cancel!</div>
        </div>

        <!-- Live Tile Equation -->
        <div id="live-eq-bar" style="text-align: center; margin-bottom: 12px; font-size: 1rem; color: rgba(255,255,255,0.6);">
            Tiles show: <span id="live-eq" style="font-weight: 800; color: #fff; font-size: 1.2rem; font-family: 'JetBrains Mono', monospace; margin: 0 4px;"></span>
            <span id="live-eq-status" style="font-size: 0.9rem; font-weight: 700;"></span>
        </div>

        <!-- Steps -->
        <div id="step-bar">
            <div class="step-pill active" id="step1">① Isolate x on one side</div>
            <div class="step-pill" id="step2">② Enter the final value of x</div>
        </div>

        <!-- Workspace -->
        <div id="workspace">
            <div class="ws-panel" id="left-panel">
                <div class="ws-label">LEFT SIDE</div>
            </div>
            <div class="ws-divider">=</div>
            <div class="ws-panel" id="right-panel">
                <div class="ws-label">RIGHT SIDE</div>
            </div>
        </div>

        <!-- Tile Tray -->
        <div id="tray-section">
            <div class="tray-label">🧱 Tile Tray — drag tiles to either side to balance & cancel!</div>
            <div id="tile-tray">
                <div class="tray-tile tray-x" data-type="x">
                    <div class="tray-tile-body">x</div>
                    <div class="tray-tile-name">+x</div>
                </div>
                <div class="tray-tile tray-nx" data-type="-x">
                    <div class="tray-tile-body">−x</div>
                    <div class="tray-tile-name">−x</div>
                </div>
                <div class="tray-tile tray-1" data-type="1">
                    <div class="tray-tile-body">1</div>
                    <div class="tray-tile-name">+1</div>
                </div>
                <div class="tray-tile tray-n1" data-type="-1">
                    <div class="tray-tile-body">−1</div>
                    <div class="tray-tile-name">−1</div>
                </div>
            </div>
        </div>

        <!-- Answer area -->
        <div id="answer-area">
            <div class="answer-label">If</div>
            <div id="x-equals">x =</div>
            <input type="number" id="answer-input" placeholder="?">
            <button class="btn-reset-ws" onclick="resetWorkspace()">↺ Clear</button>
            <button class="btn-check" onclick="checkAnswer()">✓ Check Answer</button>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <!-- Drag ghost -->
    <div id="drag-ghost"></div>

    <!-- Hurray Overlay -->
    <div id="hurray-overlay">
        <div id="hurray-box">
            <div class="hurray-emoji" id="hurray-emoji">🎉</div>
            <div class="hurray-title">HURRAY!</div>
            <div class="hurray-sub" id="hurray-sub">Correct!</div>
            <div class="hurray-pts" id="hurray-pts">+20 pts</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="algebra-tiles.js"></script>
</body>
</html>
